name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 */6 * *"   # ทุก 6 วัน
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -X GET \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          https://xqnihyrtifxhgrklcdwq.supabase.co/rest/v1/
