name: Supabase Storage Upload & Delete

on:
  workflow_dispatch:

jobs:
  storage-job:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://xqnihyrtifxhgrklcdwq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ====== Upload File ======
      - name: Upload file
        run: |
          echo "Uploading file..."
          curl -X POST "$SUPABASE_URL/storage/v1/object/evidence-files/test.txt" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: text/plain" \
            --data "Hello from GitHub Actions 🚀"

      # ====== Delete File ======
      - name: Delete file
        run: |
          echo "Deleting file..."
          curl -X DELETE "$SUPABASE_URL/storage/v1/object/evidence-files/test.txt" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
