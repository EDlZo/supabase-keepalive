name: Supabase Storage Keep Alive

on:
  schedule:
    - cron: "0 0 */6 * *"   # ทุก 6 วัน (UTC)
  workflow_dispatch:

jobs:
  ping-storage:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Storage
        run: |
          curl -s -o /dev/null -w "Storage Status: %{http_code}\n" \
          -X GET "https://xqnihyrtifxhgrklcdwq.supabase.co/storage/v1/object/list/evidence-files" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
